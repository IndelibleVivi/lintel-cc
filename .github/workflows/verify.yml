name: verify

# Synthetic defaults plus isolated browser/Linux runtime verification. This
# workflow uses `python3 tests/verify.py` on macOS and Linux. It never performs release,
# publish, deploy, or account operations, and it does not run real
# auth acceptance. Independent browser checks run real headless Chromium with
# temporary profiles/local fixtures. Linux additionally runs isolated OpenSSH
# with inert Claude fixtures (see docs/verification.md).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    name: synthetic (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            extensions/browser/package-lock.json

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux system packages (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            openssh-server openssh-client musl-tools \
            qemu-system-x86 qemu-utils cloud-image-utils gpgv ubuntu-keyring

      - name: Desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Browser test dependencies
        working-directory: extensions/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verification control self-tests
        run: |
          python3 tests/verify.py --self-test

      - name: Synthetic verification
        run: python3 tests/verify.py --json "$RUNNER_TEMP/lintel-verify/evidence.json"

      - name: Build static Linux runner
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --locked -p lintel-runner --release --target x86_64-unknown-linux-musl

      - name: Linux OpenSSH runtime acceptance
        if: runner.os == 'Linux'
        run: python3 tests/verify.py --checks linux-ssh-runtime --json "$RUNNER_TEMP/lintel-verify/linux-ssh-runtime.json"

      - name: Independent CLI candidate packaging and upgrade
        run: python3 tests/verify.py --checks cli-candidate --json "$RUNNER_TEMP/lintel-verify/cli-candidate.json"

      - name: Independent browser runtime and App pairing
        env:
          LINTEL_PAIRING_UI_REPORT: ${{ runner.temp }}/lintel-verify/browser-pairing-ui.json
          LINTEL_SERVICE_UI_REPORT: ${{ runner.temp }}/lintel-verify/service-ui.json
          LINTEL_REMOTE_TASK_UI_REPORT: ${{ runner.temp }}/lintel-verify/remote-task-ui.json
          LINTEL_WORK_UI_REPORT: ${{ runner.temp }}/lintel-verify/work-ui.json
          LINTEL_BASELINE_UI_REPORT: ${{ runner.temp }}/lintel-verify/baseline-ui.json
        run: |
          python3 tests/verify.py --checks browser-smoke,browser-pairing-ui,service-ui,remote-task-ui,work-ui,baseline-ui,site-ui,clawd-app-ui --json "$RUNNER_TEMP/lintel-verify/browser-runtime.json"

      - name: Disposable Linux VM lifecycle acceptance
        if: runner.os == 'Linux'
        env:
          LINTEL_VM_REPORT: ${{ runner.temp }}/lintel-verify/linux-vm-runtime.json
        run: python3 tests/verify.py --checks linux-vm-runtime --json "$RUNNER_TEMP/lintel-verify/linux-vm-entry.json"

      - name: Collect browser startup evidence
        if: always()
        run: |
          if [ -f extensions/browser/artifacts/browser-smoke.json ]; then
            cp extensions/browser/artifacts/browser-smoke.json "$RUNNER_TEMP/lintel-verify/browser-smoke.json"
          fi
          if [ -f extensions/browser/artifacts/browser-smoke-failure.json ]; then
            cp extensions/browser/artifacts/browser-smoke-failure.json "$RUNNER_TEMP/lintel-verify/browser-smoke-failure.json"
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lintel-verify-${{ matrix.os }}
          path: ${{ runner.temp }}/lintel-verify/*.json
          if-no-files-found: warn
