[package]
name = "lintel-core"
version = "0.1.0"
edition = "2021"

[dependencies]
lintel-operations = { path = "../operations" }
lintel-egress = { path = "../egress" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
fs2 = "0.4"
libc = "0.2"
age = { version = "0.12.1", default-features = false }

chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
