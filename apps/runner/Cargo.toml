[package]
name = "lintel-runner"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lintel"
path = "src/main.rs"

[dependencies]
lintel-core = { path = "../../crates/core" }
serde_json = "1"
lintel-remote = { path = "../../crates/remote" }
lintel-operations = { path = "../../crates/operations" }
lintel-egress = { path = "../../crates/egress" }
tokio = { version = "1", features = ["rt-multi-thread"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
lintel-browser-host = { path = "../../extensions/browser/native-host" }
