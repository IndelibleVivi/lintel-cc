[package]
name = "lintel-desktop"
version = "0.1.0"
description = "Lintel desktop environment control"
edition = "2021"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
semver = "1"
base64 = "0.22"
minisign-verify = "0.2"
serde_json = "1"
lintel-remote = { path = "../../../crates/remote" }
sha2 = "0.10"
fs2 = "0.4"
libc = "0.2"
lintel-core = { path = "../../../crates/core" }
lintel-egress = { path = "../../../crates/egress" }
tokio = { version = "1", features = ["rt", "sync", "time"] }

lintel-browser-host = { path = "../../../extensions/browser/native-host" }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
